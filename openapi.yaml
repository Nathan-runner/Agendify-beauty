openapi: 3.0.3
info:
  title: API Agenda - Otimizada para IA
  description: >
    API de gerenciamento de agendamentos, serviços e profissionais. 
    Esta especificação foi otimizada para consumo por agentes de IA, 
    fornecendo descrições semânticas detalhadas e esquemas rigorosos.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor Local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Role:
      type: string
      enum: [CLIENTE, FUNCIONARIO]
    
    Status:
      type: string
      enum: [AGUARDANDO, EM_ATENDIMENTO, FINALIZADO, CANCELADO]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        email: { type: string, format: email }
        telefone: { type: string }
        role: { $ref: '#/components/schemas/Role' }

    Professional:
      type: object
      properties:
        id: { type: string, format: uuid }
        funcao: { type: string }
        user: { $ref: '#/components/schemas/User' }
        services:
          type: array
          items: { $ref: '#/components/schemas/Service' }

    Service:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        duracaominutos: { type: integer }
        preco: { type: number, format: float }
        descricao: { type: string }
        professionalId: { type: string, format: uuid }

    Appointment:
      type: object
      properties:
        id: { type: string, format: uuid }
        dataHoraInicio: { type: string, format: date-time }
        dataHoraFim: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/Status' }
        serviceId: { type: string, format: uuid }
        profissionalId: { type: string, format: uuid }
        clienteId: { type: string, format: uuid }

    Error:
      type: object
      properties:
        error: { type: string }

paths:
  /auth/register/cliente:
    post:
      tags: [Autenticação]
      summary: Registra um novo cliente
      operationId: registerCliente
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, password, telefone]
              properties:
                nome: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 6 }
                telefone: { type: string }
      responses:
        '201':
          description: Cliente criado com sucesso
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '409':
          description: Email já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register/funcionario:
    post:
      tags: [Autenticação]
      summary: Registra um novo funcionário (Requer código da empresa)
      operationId: registerFuncionario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, email, password, telefone, funcao, codigoEmpresa]
              properties:
                nome: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                telefone: { type: string }
                funcao: { type: string }
                codigoEmpresa: { type: string }
      responses:
        '201':
          description: Funcionário criado
        '403':
          description: Código da empresa inválido

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica usuário e retorna JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login bem sucedido
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { $ref: '#/components/schemas/Role' }
                  nome: { type: string }

  /funcionarios:
    get:
      tags: [Profissionais]
      summary: Lista todos os profissionais
      security: [{ bearerAuth: [] }]
      parameters:
        - name: nome
          in: query
          schema: { type: string }
        - name: funcao
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de funcionários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Professional' }
  
  /funcionarios/{id}:
    get:
      tags: [Profissionais]
      summary: Busca um funcionário pelo ID
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dados do funcionário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Professional' }
        '404':
          description: Funcionário não encontrado
    put:
      tags: [Profissionais]
      summary: Atualiza dados do funcionário (Apenas Funcionário)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                funcao: { type: string }
      responses:
        '200':
          description: Funcionário atualizado
    delete:
      tags: [Profissionais]
      summary: Deleta um funcionário (Apenas Funcionário)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Funcionário removido

  /servicos:
    get:
      tags: [Serviços]
      summary: Lista serviços disponíveis
      parameters:
        - name: nome
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Lista de serviços
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Service' }
    post:
      tags: [Serviços]
      summary: Cria novo serviço (Apenas Funcionário)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Service' }
      responses:
        '201':
          description: Serviço criado

  /servicos/{id}:
    get:
      tags: [Serviços]
      summary: Busca um serviço pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dados do serviço
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Service' }
    put:
      tags: [Serviços]
      summary: Atualiza um serviço (Apenas Funcionário)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome: { type: string }
                duracaominutos: { type: integer }
                preco: { type: number }
                descricao: { type: string }
      responses:
        '200':
          description: Serviço atualizado
    delete:
      tags: [Serviços]
      summary: Deleta um serviço (Apenas Funcionário)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Serviço removido

  /api/agendamentos/disponibilidade:
    get:
      tags: [Agendamentos]
      summary: Consulta horários livres para um profissional e data
      parameters:
        - name: profissionalId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: dataIso
          in: query
          required: true
          schema: { type: string, format: date }
          description: Data no formato YYYY-MM-DD
        - name: duracaoServicoMinutos
          in: query
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Lista de horários ISO
          content:
            application/json:
              schema:
                type: array
                items: { type: string, format: date-time }

  /api/agendamentos:
    post:
      tags: [Agendamentos]
      summary: Cria um agendamento
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profissionalId, servicoId, clienteId, dataHoraInicio]
              properties:
                profissionalId: { type: string, format: uuid }
                servicoId: { type: string, format: uuid }
                clienteId: { type: string, format: uuid }
                dataHoraInicio: { type: string, format: date-time }
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '409':
          description: Conflito de horário

  /api/agendamentos/{id}/status:
    patch:
      tags: [Agendamentos]
      summary: Atualiza o status de um agendamento
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '200':
          description: Status atualizado
